<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos · Minha Loja</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <div id="content">
      <h2 id="orders-title">Meus pedidos</h2>
      <div id="order-tabs" class="tabs"></div>
      <div id="orders-list"></div>
    </div>
  </main>

  <!-- Janela de pagamento (simulado) -->
  <dialog id="pay-dialog">
    <form id="pay-form" class="form">
      <h2>Pagamento</h2>
      <p id="pay-summary"></p>
      <fieldset id="pay-methods" class="methods"></fieldset>
      <p class="hint">Pagamento simulado: nenhum valor é cobrado de verdade.</p>
      <button class="btn">Pagar</button>
      <button type="button" id="pay-close" class="close">✕</button>
    </form>
  </dialog>

  <script type="module" src="./pedidos.js"></script>
</body>
</html>
