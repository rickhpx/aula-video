<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque · Minha Loja</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <div id="content">
      <div class="page-header">
        <h2>Estoque</h2>
        <button id="new-btn" class="btn">+ Novo produto</button>
      </div>

      <div class="card filters">
        <input id="search" type="search" placeholder="Buscar produto...">
      </div>

      <div class="card table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>Repor</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="stock-rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Janela de cadastro / edição de produto -->
  <dialog id="product-form-dialog">
    <form id="product-form" class="form">
      <h2 id="form-title">Novo produto</h2>
      <label>Nome <input name="name" required></label>
      <label>Preço (R$) <input name="price" type="number" step="0.01" min="0.01" required></label>
      <label>Categoria <input name="category" placeholder="Ex.: Roupas" list="category-list"></label>
      <datalist id="category-list"></datalist>
      <label>Descrição <textarea name="description" rows="3" placeholder="Detalhes do produto"></textarea></label>
      <label>Estoque <input name="stock" type="number" min="0" value="0" required></label>
      <button class="btn">Salvar</button>
      <button type="button" id="form-close" class="close">✕</button>
    </form>
  </dialog>

  <script type="module" src="./estoque.js"></script>
</body>
</html>
