<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">🛍️ Minha Loja</h1>
    <nav>
      <button data-view="shop" class="nav-btn active">Produtos</button>
      <button data-view="cart" class="nav-btn auth-only">Carrinho <span id="cart-count" class="badge">0</span></button>
      <button data-view="orders" class="nav-btn auth-only">Pedidos</button>
      <button data-view="admin" class="nav-btn admin-only">Admin</button>
    </nav>
    <div class="user-area">
      <span id="user-name"></span>
      <button id="login-btn" class="btn">Entrar</button>
      <button id="logout-btn" class="btn btn-outline auth-only">Sair</button>
    </div>
  </header>

  <main>
    <!-- Vitrine -->
    <section id="view-shop" class="view">
      <h2>Produtos</h2>
      <form id="filters" class="card filters">
        <input name="q" type="search" placeholder="Buscar produto...">
        <select name="category"><option value="">Todas as categorias</option></select>
        <input name="minPrice" type="number" step="0.01" min="0" placeholder="Preço mín.">
        <input name="maxPrice" type="number" step="0.01" min="0" placeholder="Preço máx.">
        <button type="reset" class="btn btn-outline">Limpar</button>
      </form>
      <div id="products" class="grid"></div>
    </section>

    <!-- Carrinho -->
    <section id="view-cart" class="view hidden">
      <h2>Meu carrinho</h2>
      <div id="cart-items"></div>
      <div class="cart-footer">
        <strong>Total: <span id="cart-total">R$ 0,00</span></strong>
        <button id="checkout-btn" class="btn">Finalizar compra</button>
      </div>
    </section>

    <!-- Pedidos -->
    <section id="view-orders" class="view hidden">
      <h2 id="orders-title">Meus pedidos</h2>
      <div id="order-tabs" class="tabs"></div>
      <div id="orders-list"></div>
    </section>

    <!-- Admin -->
    <section id="view-admin" class="view hidden">
      <h2>Cadastrar produto</h2>
      <form id="product-form" class="card form">
        <label>Nome <input name="name" required></label>
        <label>Preço (R$) <input name="price" type="number" step="0.01" min="0.01" required></label>
        <label>Categoria <input name="category" placeholder="Ex.: Roupas" list="category-list"></label>
        <datalist id="category-list"></datalist>
        <label>Descrição <textarea name="description" rows="3" placeholder="Detalhes do produto"></textarea></label>
        <label>Estoque <input name="stock" type="number" min="0" value="0" required></label>
        <button class="btn">Cadastrar</button>
      </form>
    </section>
  </main>

  <!-- Janela de login/cadastro -->
  <dialog id="auth-dialog">
    <form id="auth-form" method="dialog" class="form">
      <h2 id="auth-title">Entrar</h2>
      <label id="name-field" class="hidden">Nome <input name="name"></label>
      <label>E-mail <input name="email" type="email" required></label>
      <label>Senha <input name="password" type="password" minlength="6" required></label>
      <p id="auth-error" class="error"></p>
      <button class="btn" id="auth-submit">Entrar</button>
      <p class="switch">
        <span id="auth-switch-text">Não tem conta?</span>
        <a href="#" id="auth-switch">Cadastre-se</a>
      </p>
      <button type="button" id="auth-close" class="close">✕</button>
    </form>
  </dialog>

  <!-- Janela de detalhes do produto -->
  <dialog id="product-dialog">
    <div class="form product-detail">
      <button type="button" id="product-close" class="close">✕</button>
      <div class="thumb" id="pd-thumb"></div>
      <span class="category" id="pd-category"></span>
      <h2 id="pd-name"></h2>
      <p id="pd-description" class="description"></p>
      <span class="price" id="pd-price"></span>
      <span class="stock" id="pd-stock"></span>

      <!-- Cliente: escolher quantidade -->
      <form id="pd-buy" class="buy-row">
        <label>Quantidade <input name="quantity" type="number" min="1" value="1" required></label>
        <button class="btn">Adicionar ao carrinho</button>
      </form>

      <!-- Admin: repor estoque e editar -->
      <div class="admin-only admin-box">
        <form id="pd-restock" class="buy-row">
          <label>Adicionar ao estoque <input name="amount" type="number" min="1" value="1" required></label>
          <button class="btn">Repor</button>
        </form>
        <details>
          <summary>Editar produto</summary>
          <form id="pd-edit" class="form">
            <label>Nome <input name="name" required></label>
            <label>Preço (R$) <input name="price" type="number" step="0.01" min="0.01" required></label>
            <label>Categoria <input name="category" list="category-list"></label>
            <label>Descrição <textarea name="description" rows="3"></textarea></label>
            <label>Estoque <input name="stock" type="number" min="0" required></label>
            <button class="btn">Salvar</button>
          </form>
        </details>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
