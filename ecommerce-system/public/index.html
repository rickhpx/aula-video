<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">🛍️ Minha Loja</h1>
    <nav>
      <button data-view="shop" class="nav-btn active">Produtos</button>
      <button data-view="cart" class="nav-btn auth-only">Carrinho <span id="cart-count" class="badge">0</span></button>
      <button data-view="orders" class="nav-btn auth-only">Pedidos</button>
      <button data-view="admin" class="nav-btn admin-only">Admin</button>
    </nav>
    <div class="user-area">
      <span id="user-name"></span>
      <button id="login-btn" class="btn">Entrar</button>
      <button id="logout-btn" class="btn btn-outline auth-only">Sair</button>
    </div>
  </header>

  <main>
    <!-- Vitrine -->
    <section id="view-shop" class="view">
      <h2>Produtos</h2>
      <div id="products" class="grid"></div>
    </section>

    <!-- Carrinho -->
    <section id="view-cart" class="view hidden">
      <h2>Meu carrinho</h2>
      <div id="cart-items"></div>
      <div class="cart-footer">
        <strong>Total: <span id="cart-total">R$ 0,00</span></strong>
        <button id="checkout-btn" class="btn">Finalizar compra</button>
      </div>
    </section>

    <!-- Pedidos -->
    <section id="view-orders" class="view hidden">
      <h2>Meus pedidos</h2>
      <div id="orders-list"></div>
    </section>

    <!-- Admin -->
    <section id="view-admin" class="view hidden">
      <h2>Cadastrar produto</h2>
      <form id="product-form" class="card form">
        <label>Nome <input name="name" required></label>
        <label>Preço (R$) <input name="price" type="number" step="0.01" min="0.01" required></label>
        <label>Estoque <input name="stock" type="number" min="0" value="0" required></label>
        <button class="btn">Cadastrar</button>
      </form>
    </section>
  </main>

  <!-- Janela de login/cadastro -->
  <dialog id="auth-dialog">
    <form id="auth-form" method="dialog" class="form">
      <h2 id="auth-title">Entrar</h2>
      <label id="name-field" class="hidden">Nome <input name="name"></label>
      <label>E-mail <input name="email" type="email" required></label>
      <label>Senha <input name="password" type="password" minlength="6" required></label>
      <p id="auth-error" class="error"></p>
      <button class="btn" id="auth-submit">Entrar</button>
      <p class="switch">
        <span id="auth-switch-text">Não tem conta?</span>
        <a href="#" id="auth-switch">Cadastre-se</a>
      </p>
      <button type="button" id="auth-close" class="close">✕</button>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
